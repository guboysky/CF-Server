name: CF theme validation and build
on:
  push:
    branches: [main, master]
    paths: ['cfsm/**', '.github/workflows/cfsm.yml']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfsm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfsm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cfsm/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
      - name: Append CF build history
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/cfsm-message.txt"
          target="$RUNNER_TEMP/cfsm-build"
          if git ls-remote --exit-code --heads origin cfsm-dist >/dev/null 2>&1; then
            git fetch origin cfsm-dist
            git worktree add --detach "$target" origin/cfsm-dist
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" checkout --orphan cfsm-build-initial
            git -C "$target" rm -rf --ignore-unmatch .
          fi
          rsync -a --delete --exclude=.git dist/ "$target/"
          git -C "$target" add -A
          git -C "$target" commit --allow-empty -F "$RUNNER_TEMP/cfsm-message.txt"
          git -C "$target" push origin HEAD:refs/heads/cfsm-dist
